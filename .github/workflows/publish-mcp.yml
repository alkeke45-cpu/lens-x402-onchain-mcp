name: Publish to MCP Registry

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  id-token: write # for mcp-publisher GitHub OIDC login
  contents: write # to create/update the release holding the MCPB bundle

env:
  MCP_PUBLISHER_VERSION: v1.8.1
  RELEASE_TAG: v0.1.0
  MCPB_FILE: lens-x402-onchain-mcp.mcpb

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Smoke test (offline — protocol handshake + tools/list)
        run: npm run smoke:offline

      - name: Build MCPB bundle
        run: |
          set -euo pipefail
          npm prune --omit=dev
          rm -f "$MCPB_FILE"
          zip -qr "$MCPB_FILE" manifest.json package.json package-lock.json \
            README.md LICENSE src node_modules -x "node_modules/.package-lock.json"
          ls -la "$MCPB_FILE"

      - name: Upload MCPB bundle to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" \
              --title "lens-x402-onchain-mcp $RELEASE_TAG" \
              --notes "MCPB bundle for the Official MCP Registry entry io.github.alkeke45-cpu/lens-x402-onchain-mcp."
          gh release upload "$RELEASE_TAG" "$MCPB_FILE" --clobber

      - name: Point server.json at the uploaded bundle
        run: |
          set -euo pipefail
          SHA="$(sha256sum "$MCPB_FILE" | awk '{print $1}')"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/${MCPB_FILE}"
          jq --arg sha "$SHA" --arg url "$URL" \
            '.packages[0].fileSha256 = $sha | .packages[0].identifier = $url' \
            server.json > server.tmp && mv server.tmp server.json
          cat server.json

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"

          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
